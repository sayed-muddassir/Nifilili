spring:
  application:
    name: nifilili

  datasource:
    url: jdbc:postgresql://localhost:5432/nifilili_db
    username: sayedmuddassirhussain
    password: 060398
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: true
  mvc:
    throw-exception-if-no-handler-found: true

  flyway:
    enabled: true

  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 15MB

logging:
  level:
    org.flywaydb: INFO

app:
  jwt-secret: daf66e01593f61a15b857cf433aae03a005812b31234e149036bcc8dee755dbb
  jwt-access-expiration-ms: 900000
  jwt-refresh-expiration-ms: 2592000000
  business-files:
    base-path: /tmp/nifilili/files
    storage-provider: local  # 'local' | 'aws-s3' | 'gcs' - select storage backend
    path-strategy: flat      # 'flat' | 'dated' | 'by-module' - configurable folder structure
    max-file-size: 10428800  # 10MB in bytes
    allowed-extensions: .pdf,.doc,.docx,.xls,.xlsx,.ppt,.pptx,.txt,.jpg,.jpeg,.png,.gif,.zip
    retention-policy: keep-all  # 'keep-all' | 'keep-latest-5'
  cors:
    allowed-origins:
      - http://localhost:3000
    allowed-methods:
      - GET
      - POST
      - PUT
      - PATCH
      - DELETE
      - OPTIONS
    allowed-headers:
      - Authorization
      - Content-Type
      - X-Requested-With
      - X-Refresh-Token
      - X-Device-Name
    exposed-headers: []
    allow-credentials: false
    max-age: 3600

springdoc:
  swagger-ui:
    tagsSorter: alpha
